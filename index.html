<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors - Classic Game</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game-card">
  <header class="header">
<h1>Rock Paper Scissors</h1>
      <p>First to reach 5 points wins!</p>
    </header>
<section class="scoreboard">
      <div class="score-box">
    <span class="label">Player</span>
  <span id="player-score" class="score">0</span>
</div>
<div class="divider">:</div>
        <div class="score-box">
 <span class="label">Computer</span>
    <span id="computer-score" class="score">0</span>
        </div>
</section>
      <section class="arena">
 <div class="choices-display">
    <div id="player-card" class="choice-card">❓</div>
  <span class="vs-badge">VS</span>
       <div id="computer-card" class="choice-card">❓</div>
</div>
  <div id="message" class="message-banner">Choose your move to begin!</div>
</section>
  <section class="controls">
<button class="btn choice-btn" data-choice="rock">
     <span class="icon">✊</span>
    <span>Rock</span>
 </button>
      <button class="btn choice-btn" data-choice="paper">
   <span class="icon">✋</span>
 <span>Paper</span>
     </button>
  <button class="btn choice-btn" data-choice="scissors">
 <span class="icon">✌️</span>
        <span>Scissors</span>
    </button>
 </section>
      <button id="reset-btn" class="btn reset-btn">Reset Match</button>
 </div>
<script src="script.js"></script>
</body>
</html>
